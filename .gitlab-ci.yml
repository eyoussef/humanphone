# Mirrors .github/workflows/android.yml: debug APK plus unit tests on every push.
stages:
  - build

default:
  image: eclipse-temurin:17-jdk
  variables:
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip curl > /dev/null
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
    - mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
    - yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
    - $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
  cache:
    key: humanphone-gradle
    paths:
      - .gradle-home/

build:
  stage: build
  timeout: 45m
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest
  artifacts:
    name: humanphone-debug-apk
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 30 days

release-check:
  stage: build
  timeout: 45m
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon --stacktrace assembleRelease
  artifacts:
    name: humanphone-release-unsigned
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 90 days
